<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Headshot placeholder">
  <!-- Transparent canvas: the surrounding bg-raised token shows through
       behind this, so the placeholder adapts to Noir or Daylight without
       needing a second file. Line art stays a neutral slate that reads on
       either ground rather than claiming either theme's specific accent. -->

  <!-- Abstract figure: shoulders and head, kept deliberately generic. -->
  <g fill="none" stroke="#7A7E83" stroke-opacity="0.4" stroke-width="1.5">
    <circle cx="400" cy="420" r="112"/>
    <path d="M232 700c0-93 75-168 168-168s168 75 168 168"/>
  </g>

  <g fill="#7A7E83" fill-opacity="0.55">
    <rect x="352" y="792" width="96" height="1"/>
  </g>

  <text x="400" y="836" fill="#7A7E83" font-family="'Roboto Mono', ui-monospace, monospace"
        font-size="19" letter-spacing="4.5" text-anchor="middle">
    HEADSHOT
  </text>
  <text x="400" y="868" fill="#7A7E83" fill-opacity="0.75" font-family="'Roboto Mono', ui-monospace, monospace"
        font-size="14" letter-spacing="1.6" text-anchor="middle">
    replace public/images/
  </text>
  <text x="400" y="890" fill="#7A7E83" fill-opacity="0.75" font-family="'Roboto Mono', ui-monospace, monospace"
        font-size="14" letter-spacing="1.6" text-anchor="middle">
    headshot-placeholder.svg
  </text>
</svg>
