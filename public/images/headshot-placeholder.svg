<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Headshot placeholder">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242120"/>
      <stop offset="55%" stop-color="#1f1c1b"/>
      <stop offset="100%" stop-color="#191716"/>
